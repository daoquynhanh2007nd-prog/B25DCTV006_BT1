<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Khoa Học</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div id="screen">0</div>
        
        <div class="buttons">
            <button class="btn func" data-val="log2e">log2e</button>
            <button class="btn func" data-val="log10e">log10e</button>
            <button class="btn func" data-val="!">x!</button>
            <button class="btn" data-val="(">(</button>
            <button class="btn" data-val=")">)</button>
            <button class="btn op" data-val="%">%</button>
            <button class="btn clear" id="btn-clear">CE</button>

            <button class="btn func" data-val="EXP(">EXP</button>
            <button class="btn func" data-val="sin(">sin</button>
            <button class="btn func" data-val="ln(">ln</button>
            <button class="btn num" data-val="7">7</button>
            <button class="btn num" data-val="8">8</button>
            <button class="btn num" data-val="9">9</button>
            <button class="btn op" data-val="÷">÷</button>

            <button class="btn func" data-val="π">π</button>
            <button class="btn func" data-val="cos(">cos</button>
            <button class="btn func" data-val="log(">log</button>
            <button class="btn num" data-val="4">4</button>
            <button class="btn num" data-val="5">5</button>
            <button class="btn num" data-val="6">6</button>
            <button class="btn op" data-val="×">×</button>

            <button class="btn func" data-val="e">e</button>
            <button class="btn func" data-val="tan(">tan</button>
            <button class="btn func" data-val="√(">√</button>
            <button class="btn num" data-val="1">1</button>
            <button class="btn num" data-val="2">2</button>
            <button class="btn num" data-val="3">3</button>
            <button class="btn op" data-val="-">-</button>

            <button class="btn func" data-val="^2">x²</button>
            <button class="btn func" data-val="^3">x³</button>
            <button class="btn func" data-val="^">xʸ</button>
            <button class="btn num" data-val="0">0</button>
            <button class="btn num" data-val=".">.</button>
            <button class="btn equals" id="btn-equals">=</button>
            <button class="btn op" data-val="+">+</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
